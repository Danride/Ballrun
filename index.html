function doRevive() {
  const g = gameRef;
  if (!g) return;
  audio.revive();

  g.over = false;
  g.deathTime = 0;
  g.shake = 0;
  g.player.y = 0;
  g.player.vy = 0;
  g.player.jumping = false;
  g.player.sliding = false;
  g.player.slideT = 0;
  g.player.falling = false;
  g.player.roll = 0;
  g.player.pitch = 0;

  g.obstacles = g.obstacles.filter(o => o.z < -6);
  g.coins = g.coins.filter(o => o.z < -6 && !o.dead);
  g.pickupStars = g.pickupStars.filter(o => o.z < -6 && !o.dead);
  g.nextSpawnZ = Math.max(g.nextSpawnZ, 60);

  g.invulnTime = 2.5;

  state.phase = 'play';
  state.overStage = null;
  dom.gameOver.classList.add('hidden');
  dom.gameOver.innerHTML = '';
  updateUIVisibility();
  renderAbilitiesBar();
}

async function reviveForAd() {
  showAdWaiting('воскресни и продолжи');
  const result = await showRewardAd();
  if (result === true) {
    doRevive();
  } else if (result === false) {
    showRevivePrompt();
  } else {
    dom.gameOver.innerHTML = `
      <div class="revive-card">
        <div class="revive-title">РЕКЛАМА</div>
        <div class="revive-subtitle">смотрим рекламу…</div>
        <div class="ad-progress"><div class="ad-progress-bar"></div></div>
        <div class="revive-timer">2 СЕКУНДЫ</div>
      </div>
    `;
    setTimeout(() => { doRevive(); }, 1400);
  }
}

function reviveForStar() {
  if (getAvailableStars() < 1) return;
  spendStarForRevive();
  doRevive();
}

function declineRevive() {
  const score = state.pendingScore;
  const isNewRecord = score > state.best;
  if (isNewRecord) state.best = score;
  state.bank += state.pendingCoins;
  state.coinsAll += state.pendingCoins;
  state.stars += state.pendingStars;
  state.starsAll += state.pendingStars;
  state.runs += 1;
  saveState();
  updateMenuBankLine();

  state.overStage = 'stats';
  showStats(gameRef, score, isNewRecord);
  updateUIVisibility();
}

function renderShopPanel() {
  const dailyStar = getStarDaily();
  const dailyAd = getRubiesAdDaily();
  const starLeft = Math.max(0, STAR_DAILY_LIMIT - dailyStar.used);
  const adLeft = Math.max(0, RUBIES_AD_DAILY_LIMIT - dailyAd.used);

  const starDisabled = starLeft <= 0 || state.bank < STAR_PRICE;
  const boostDisabled = state.boost2x || state.bank < BOOST_PRICE;
  const adDisabled = adLeft <= 0;

  const gemInline = `<span class="ic" data-icon="gem" style="font-size:12px"></span>`;
  const tvInline = `<span class="ic" data-icon="tv" style="font-size:12px"></span>`;

  const starAction = starLeft <= 0
    ? `<div class="buy-btn" style="opacity:0.4;cursor:not-allowed">ЛИМИТ</div>`
    : `<button class="buy-btn" data-buy="star" ${starDisabled ? 'disabled' : ''}>${gemInline} ${STAR_PRICE}</button>`;

  const boostAction = state.boost2x
    ? `<div class="buy-btn owned">КУПЛЕНО</div>`
    : `<button class="buy-btn" data-buy="boost2x" ${boostDisabled ? 'disabled' : ''}>${gemInline} ${BOOST_PRICE}</button>`;

  const adAction = adLeft <= 0
    ? `<div class="buy-btn" style="opacity:0.4;cursor:not-allowed">ЛИМИТ</div>`
    : `<button class="buy-btn ad" data-buy="rubies-ad" ${adDisabled ? 'disabled' : ''}>${tvInline} +1000</button>`;

  const abilitiesHtml = ABILITIES.map(a => {
    const count = state.abilities[a.id] || 0;
    const canBuy = state.bank >= a.price;
    return `
      <div class="panel-item">
        <div class="item-icon ${a.id} ic" data-icon="${a.id}"></div>
        <div class="item-info">
          <div class="item-name">
            ${a.name}
            ${count > 0 ? `<span class="inv-count">×${count}</span>` : ''}
          </div>
          <div class="item-desc">${a.desc}</div>
        </div>
        <button class="buy-btn" data-buy-ability="${a.id}" ${canBuy ? '' : 'disabled'}>${gemInline} ${a.price}</button>
      </div>
    `;
  }).join('');

  return `<div class="panel">
    <div class="panel-header">
      <div class="panel-title">МАГАЗИН</div>
      <div class="panel-bank"><span class="ic" data-icon="gem"></span> ${state.bank}</div>
    </div>
    <div class="panel-list">
      <div class="panel-item">
        <div class="item-icon star ic" data-icon="star"></div>
        <div class="item-info">
          <div class="item-name">ЗВЕЗДА</div>
          <div class="item-desc ${starLeft <= 0 ? 'warn' : ''}">+1 звезда для воскрешения · сегодня ${dailyStar.used}/${STAR_DAILY_LIMIT}</div>
        </div>
        ${starAction}
      </div>
      <div class="panel-item">
        <div class="item-icon boost ic" data-icon="bolt"></div>
        <div class="item-info">
          <div class="item-name">2X СКОРОСТЬ</div>
          <div class="item-desc">Следующий забег с ×2 скоростью</div>
        </div>
        ${boostAction}
      </div>
      <div class="panel-item">
        <div class="item-icon ad ic" data-icon="tv"></div>
        <div class="item-info">
          <div class="item-name">РЕКЛАМА → РУБИНЫ</div>
          <div class="item-desc ${adLeft <= 0 ? 'warn' : ''}">+1000 ромбов за просмотр · сегодня ${dailyAd.used}/${RUBIES_AD_DAILY_LIMIT}</div>
        </div>
        ${adAction}
      </div>
      <div style="height:4px"></div>
      <div style="color:#9d9d9d;font-size:10px;letter-spacing:3px;font-weight:800;padding:4px 6px">УМЕНИЯ · В ЗАБЕГЕ</div>
      ${abilitiesHtml}
    </div>
    <button class="back-btn" data-close>НАЗАД</button>
  </div>`;
}

function renderProfilePanel() {
  const gem = `<span class="ic" data-icon="gem" style="font-size:14px"></span>`;
  const star = `<span class="ic" data-icon="star" style="font-size:14px"></span>`;
  return `<div class="panel">
    <div class="panel-header"><div class="panel-title">ПРОФИЛЬ</div></div>
    <div class="panel-stat-list">
      <div class="stat-row"><span class="stat-label-panel">РЕКОРД</span><span class="stat-value-panel">${state.best}</span></div>
      <div class="stat-row"><span class="stat-label-panel">БАНК</span><span class="stat-value-panel">${gem} ${state.bank}</span></div>
      <div class="stat-row"><span class="stat-label-panel">ЗВЁЗДЫ</span><span class="stat-value-panel">${star} ${state.stars}</span></div>
      <div class="stat-row"><span class="stat-label-panel">ВСЕГО РОМБОВ</span><span class="stat-value-panel">${state.coinsAll}</span></div>
      <div class="stat-row"><span class="stat-label-panel">ВСЕГО ЗВЁЗД</span><span class="stat-value-panel">${state.starsAll}</span></div>
      <div class="stat-row"><span class="stat-label-panel">ЗАБЕГОВ</span><span class="stat-value-panel">${state.runs}</span></div>
    </div>
    <button class="back-btn" data-close>НАЗАД</button>
  </div>`;
}

function openPanel(tab) {
  state.menuTab = tab;
  let html = '';
  if (tab === 'shop') html = renderShopPanel();
  else if (tab === 'profile') html = renderProfilePanel();
  dom.panelOverlay.innerHTML = html;
  applyIcons(dom.panelOverlay);
  dom.panelOverlay.classList.remove('hidden');
}
function closePanel() {
  state.menuTab = null;
  dom.panelOverlay.classList.add('hidden');
  dom.panelOverlay.innerHTML = '';
}
function refreshPanel() {
  if (!state.menuTab) return;
  openPanel(state.menuTab);
  updateMenuBankLine();
}

function buyStar() {
  const daily = getStarDaily();
  if (daily.used >= STAR_DAILY_LIMIT) { audio.error(); return; }
  if (state.bank < STAR_PRICE) { audio.error(); return; }
  state.bank -= STAR_PRICE;
  state.stars += 1;
  daily.used += 1;
  LS.set('nb_star_daily', daily);
  audio.buy();
  saveState();
  refreshPanel();
}
function buyBoost2x() {
  if (state.boost2x) return;
  if (state.bank < BOOST_PRICE) { audio.error(); return; }
  state.bank -= BOOST_PRICE;
  state.boost2x = true;
  audio.buy();
  saveState();
  refreshPanel();
}
async function buyRubiesForAd() {
  const daily = getRubiesAdDaily();
  if (daily.used >= RUBIES_AD_DAILY_LIMIT) { audio.error(); return; }

  dom.panelOverlay.innerHTML = `
    <div class="revive-card">
      <div class="revive-title">РЕКЛАМА</div>
      <div class="revive-subtitle">за просмотр +${RUBIES_AD_REWARD} ромбов</div>
      <div class="ad-spinner ic" data-icon="spinner"></div>
      <div class="ad-progress"><div class="ad-progress-bar"></div></div>
      <div class="revive-timer">ЗАГРУЗКА</div>
    </div>
  `;
  applyIcons(dom.panelOverlay);

  const result = await showRewardAd();
  const finish = () => {
    if (result === false) {
      audio.error();
      openPanel('shop');
      return;
    }
    state.bank += RUBIES_AD_REWARD;
    daily.used += 1;
    LS.set('nb_rubies_ad_daily', daily);
    saveState();
    audio.buy();
    openPanel('shop');
  };

  if (result === null) setTimeout(finish, 1400);
  else finish();
}
function buyAbility(id) {
  const def = ABILITY_BY_ID[id];
  if (!def) return;
  if (state.bank < def.price) { audio.error(); return; }
  state.bank -= def.price;
  state.abilities[id] = (state.abilities[id] || 0) + 1;
  audio.buy();
  saveState();
  refreshPanel();
}

function setPhase(phase) {
  state.phase = phase;
  updateUIVisibility();
}
function updateUIVisibility() {
  const isPlay = state.phase === 'play';
  const isMenu = state.phase === 'menu';
  const isOverActive = state.phase === 'over' && state.overStage !== null;

  dom.hud.classList.toggle('hidden', !isPlay);
  dom.hudDistance.classList.toggle('hidden', !isPlay);
  dom.menu.classList.toggle('hidden', !(isMenu && !state.menuTab));
  dom.gameOver.classList.toggle('hidden', !isOverActive);

  dom.boostBadge.classList.toggle('hidden', !isPlay);
  dom.shieldBadge.classList.toggle('hidden', !isPlay);

  if (isPlay) renderAbilitiesBar();
  else dom.abilitiesBar.classList.add('hidden');

  if (!isMenu) closePanel();
}

let gameRef = null;
let overDelayTimer = null;
let lastScoreStr = '';
let lastCoinsStr = '';
let lastThemeStr = '';
let lastDistStr = '';
let lastStarsStr = '';
let lastBoostStr = '';
let lastShieldStr = '';

function startGame() {
  audio.init(); audio.click();
  if (overDelayTimer) { clearTimeout(overDelayTimer); overDelayTimer = null; }
  state.overStage = null;
  dom.gameOver.classList.add('hidden');
  dom.gameOver.innerHTML = '';

  const g = gameRef;
  if (!g) return;

  resetGame(g, {});

  if (state.boost2x) {
    g.baseSpeed *= BOOST_MULT;
    g.maxSpeed *= BOOST_MULT;
    g.speed = g.baseSpeed;
    state.boost2x = false;
  }
  saveState();

  closePanel();
  setPhase('play');
}

function goMenu() {
  audio.click();
  if (overDelayTimer) { clearTimeout(overDelayTimer); overDelayTimer = null; }
  state.overStage = null;
  dom.gameOver.classList.add('hidden');
  dom.gameOver.innerHTML = '';

  const g = gameRef;
  if (g) {
    g.themeJustChanged = 0;
    g.menuFrozen = true;
  }
  closePanel();
  updateMenuBankLine();
  setPhase('menu');
}

function handleGameOver(score) {
  const g = gameRef;
  state.phase = 'over';
  state.overStage = null;

  state.pendingScore = score;
  state.pendingCoins = g.coinsCollected;
  state.pendingStars = g.starsCollected;

  if (overDelayTimer) clearTimeout(overDelayTimer);
  overDelayTimer = setTimeout(() => {
    state.overStage = 'revive';
    showRevivePrompt();
    updateUIVisibility();
  }, 600);

  updateUIVisibility();
}

function bindEvents() {
  dom.playBtn.addEventListener('click', startGame);

  dom.gameOver.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.id === 'retry-btn')         startGame();
    else if (btn.id === 'menu-btn')     goMenu();
    else if (btn.id === 'revive-ad-btn')     reviveForAd();
    else if (btn.id === 'revive-star-btn')   reviveForStar();
    else if (btn.id === 'revive-decline')    declineRevive();
  });

  dom.abilitiesBar.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-ability]');
    if (!btn) return;
    useAbility(btn.dataset.ability);
  });

  dom.menu.addEventListener('click', (e) => {
    const t = e.target.closest('[data-panel]');
    if (!t) return;
    audio.init(); audio.click();
    openPanel(t.dataset.panel);
    updateUIVisibility();
  });

  dom.panelOverlay.addEventListener('click', (e) => {
    const t = e.target.closest('[data-buy],[data-buy-ability],[data-close]');
    if (!t) return;
    if (t.hasAttribute('data-close')) { audio.click(); closePanel(); updateUIVisibility(); return; }
    if (t.dataset.buy === 'star')         buyStar();
    else if (t.dataset.buy === 'boost2x') buyBoost2x();
    else if (t.dataset.buy === 'rubies-ad') buyRubiesForAd();
    else if (t.dataset.buyAbility)        buyAbility(t.dataset.buyAbility);
  });

  window.addEventListener('keydown', (e) => {
    audio.init();
    const k = e.key;
    if (state.phase !== 'play') {
      if (k === ' ' || k === 'Enter') { e.preventDefault(); startGame(); }
      return;
    }
    const g = gameRef; if (!g) return;

    if (k === '1') { useAbility('magnet'); return; }
    if (k === '2') { useAbility('slowmo'); return; }
    if (k === '3') { useAbility('teleport'); return; }
    if (k === '4') { useAbility('invisible'); return; }
    if (k === '5') { useAbility('shield'); return; }

    switch (k) {
      case 'ArrowLeft': case 'a': case 'A': case 'ф': case 'Ф':
        e.preventDefault(); doAction(g, 'left'); break;
      case 'ArrowRight': case 'd': case 'D': case 'в': case 'В':
        e.preventDefault(); doAction(g, 'right'); break;
      case 'ArrowUp': case 'w': case 'W': case 'ц': case 'Ц':
        e.preventDefault(); doAction(g, 'jump'); break;
      case 'ArrowDown': case 's': case 'S': case 'ы': case 'Ы':
        e.preventDefault(); doAction(g, 'slide'); break;
      case ' ': case 'Spacebar':
        e.preventDefault(); doAction(g, 'jump'); break;
    }
  }, { passive: false });

  let touchX = 0, touchY = 0;
  dom.root.addEventListener('touchstart', (e) => {
    audio.init();
    const t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY;
  }, { passive: true });

  dom.root.addEventListener('touchend', (e) => {
    const g = gameRef; if (!g) return;
    if (state.phase !== 'play') return;
    if (e.target.closest && e.target.closest('#abilities-bar')) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < 24 && ay < 24) { doAction(g, 'jump'); return; }
    if (ax > ay) doAction(g, dx > 0 ? 'right' : 'left');
    else         doAction(g, dy > 0 ? 'slide' : 'jump');
  }, { passive: true });
}

let _lastResizeKey = '';
function resize() {
  const g = gameRef; if (!g) return;
  const rect = dom.root.getBoundingClientRect();
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  const wCss = rect.width, hCss = rect.height;
  const MAX_PIXELS = IS_MOBILE ? 1400 * 900 : 2200 * 1300;
  let totalPx = wCss * hCss * dpr * dpr;
  if (totalPx > MAX_PIXELS) {
    dpr = Math.sqrt(MAX_PIXELS / (wCss * hCss));
    dpr = Math.max(1, dpr);
  }

  const wPx = Math.max(1, Math.floor(wCss * dpr));
  const hPx = Math.max(1, Math.floor(hCss * dpr));

  const key = wPx + 'x' + hPx;
  if (key === _lastResizeKey) return;
  _lastResizeKey = key;

  g.canvas.width = wPx;
  g.canvas.height = hPx;
  g.canvas.style.width  = wCss + 'px';
  g.canvas.style.height = hCss + 'px';
  g.w = wCss;
  g.h = hCss;
  g.dpr = dpr;
  g.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const MAX_DT = 1 / 55;

function main() {
  initVK();
  applyIcons(document);

  setTimeout(() => { syncFromVK(); }, 300);

  gameRef = createGame(dom.canvas);
  const g = gameRef;

  g.onGameOver = (score) => handleGameOver(score);

  resize();
  let resizeTimer = null;
  const onResize = () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 100);
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  updateMenuBankLine();
  updateUIVisibility();

  let last = performance.now();
  const loop = (now) => {
    try {
      let dt = (now - last) / 1000;
      last = now;
      if (!Number.isFinite(dt) || dt < 0) dt = 0.016;
      if (dt > MAX_DT) dt = MAX_DT;

      const phase = state.phase;

      if (phase === 'play') {
        update(g, dt);
      } else if (phase === 'menu') {
        g.time += dt;
        if (!g.menuFrozen) {
          g.distance += dt * 16;
          g.dyAt    = (z) => roadY(g.distance + z) - roadY(g.distance);
          g.curveAt = (z) => roadX(g.distance + z) - roadX(g.distance);
          const seg = Math.floor(g.distance / THEME_DIST);
          if (seg !== g.lastSeg) {
            g.lastSeg = seg;
            g.prevThemeIdx = g.themeIdx;
            g.themeIdx = themeForSeg(g, seg);
            g._themeLabel = THEMES[g.themeIdx].name;
            g.transitionT = 0;
          }
          if (g.transitionT < 1) g.transitionT = Math.min(1, g.transitionT + dt / THEME_TRANSITION_TIME);
          if (g.themeJustChanged > 0) g.themeJustChanged -= dt;
          const targetFar = 95 + Math.sin(g.time * 0.16) * 28;
          g.farZ = lerp(g.farZ, targetFar, Math.min(1, dt * 1.6));

          generateRoadKeys(g, g.distance + g.farZ + 400);

          const maxLaneMenu = lanesCount(g, g.distance) - 1;
          if (g.player.lane > maxLaneMenu) g.player.lane = maxLaneMenu;
          const targetX = laneX(g, g.player.lane, g.distance);
          g.player.x += (targetX - g.player.x) * Math.min(1, dt * 4);
        }
        g.player.roll = Math.sin(g.time * 1.5) * 0.25;
        g.player.pitch = Math.sin(g.time * 0.9 + 1.2) * 0.20;
      } else {
        g.time += dt;
        g.deathTime += dt;
        if (g.transitionT < 1) g.transitionT = Math.min(1, g.transitionT + dt / THEME_TRANSITION_TIME);
        if (g.shake > 0) { g.shake -= dt * 2; if (g.shake < 0) g.shake = 0; }
      }

      render(g, phase === 'over');

      if (phase === 'play') {
        const sStr = String(Math.floor(g.score));
        if (sStr !== lastScoreStr) { dom.score.textContent = sStr; lastScoreStr = sStr; }
        const cStr = String(g.coinsCollected);
        if (cStr !== lastCoinsStr) { dom.coins.textContent = cStr; lastCoinsStr = cStr; }
        const tStr = g._themeLabel;
        if (tStr !== lastThemeStr) { dom.themeLabel.textContent = tStr; lastThemeStr = tStr; }
        const dStr = String(Math.floor(g.distance));
        if (dStr !== lastDistStr) { dom.distance.textContent = dStr; lastDistStr = dStr; }
        const stStr = String(getAvailableStars());
        if (stStr !== lastStarsStr) { dom.starsHud.textContent = stStr; lastStarsStr = stStr; }
        const bStr = g.baseSpeed > 30 ? 'on' : 'off';
        if (bStr !== lastBoostStr) {
          dom.boostBadge.classList.toggle('hidden', bStr !== 'on');
          lastBoostStr = bStr;
        }
        const shStr = g.invulnTime > 0 ? 'on' : 'off';
        if (shStr !== lastShieldStr) {
          dom.shieldBadge.classList.toggle('hidden', shStr !== 'on');
          lastShieldStr = shStr;
        }
        renderAbilitiesBar();
      }
    } catch (err) {
      console.error('Loop error:', err);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

bindEvents();
main();

})();
</script>
</body>
</html>
